<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FairShare - Review Scan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased flex justify-center">

  <main class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col justify-between shadow-2xl">
    <!-- Header -->
    <header class="p-4 bg-white border-b border-slate-200 flex justify-between items-center sticky top-0 z-10">
      <div>
        <h1 class="font-bold text-base text-slate-900">Review Items</h1>
        <p class="text-xs text-slate-400">Extracted with Gemini Vision</p>
      </div>
      <a href="index.html" class="text-xs text-slate-400 hover:text-slate-600">Cancel</a>
    </header>

    <!-- Editable Items Container -->
    <div class="flex-1 p-4 overflow-y-auto flex flex-col gap-3">
      <div id="items-list" class="flex flex-col gap-2">
        <!-- Rendered by JavaScript -->
      </div>

      <button onclick="addNewItemRow()" class="w-full py-2.5 border-2 border-dashed border-slate-300 text-slate-600 font-semibold rounded-xl text-xs hover:border-slate-400">
        + Add Missing Item
      </button>

      <!-- Tax & Tip Controls -->
      <div class="bg-white p-4 rounded-xl border border-slate-200 mt-2 flex flex-col gap-3 text-xs">
        <div class="flex justify-between items-center">
          <label class="font-medium text-slate-600">Tax ($)</label>
          <input type="number" id="tax-input" step="0.01" class="w-24 text-right p-1.5 border border-slate-200 rounded-lg font-bold" />
        </div>
        <div class="flex justify-between items-center">
          <label class="font-medium text-slate-600">Tip ($)</label>
          <input type="number" id="tip-input" step="0.01" class="w-24 text-right p-1.5 border border-slate-200 rounded-lg font-bold" />
        </div>
      </div>
    </div>

    <!-- Bottom Action -->
    <footer class="p-4 bg-white border-t border-slate-200">
      <button onclick="confirmAndOpenRoom()" class="w-full py-3.5 bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition">
        Confirm & Open Room (X7K2) →
      </button>
    </footer>
  </main>

  <script>
    let receipt = JSON.parse(localStorage.getItem('currentReceipt') || '{}');

    function renderItems() {
      const container = document.getElementById('items-list');
      container.innerHTML = receipt.items.map((item, index) => `
        <div class="bg-white p-3 rounded-xl border border-slate-200 flex items-center gap-2">
          <input type="text" value="${item.name}" onchange="updateItem(${index}, 'name', this.value)" class="flex-1 text-xs font-semibold text-slate-800 p-1 border-b border-transparent focus:border-slate-300 focus:outline-none" />
          <div class="flex items-center gap-1">
            <span class="text-xs text-slate-400">qty</span>
            <input type="number" value="${item.quantity}" onchange="updateItem(${index}, 'quantity', parseInt(this.value))" class="w-10 text-center text-xs p-1 border rounded" />
          </div>
          <div class="flex items-center gap-1">
            <span class="text-xs text-slate-400">$</span>
            <input type="number" step="0.01" value="${item.price.toFixed(2)}" onchange="updateItem(${index}, 'price', parseFloat(this.value))" class="w-16 text-right text-xs p-1 border rounded font-semibold" />
          </div>
          <button onclick="removeItem(${index})" class="text-red-400 hover:text-red-600 text-xs px-1">✕</button>
        </div>
      `).join('');

      document.getElementById('tax-input').value = receipt.tax.toFixed(2);
      document.getElementById('tip-input').value = receipt.tip.toFixed(2);
    }

    function updateItem(index, key, val) {
      receipt.items[index][key] = val;
    }

    function removeItem(index) {
      receipt.items.splice(index, 1);
      renderItems();
    }

    function addNewItemRow() {
      receipt.items.push({
        id: Date.now(),
        name: "New Item",
        quantity: 1,
        price: 5.00,
        claims: {}
      });
      renderItems();
    }

    function confirmAndOpenRoom() {
      receipt.tax = parseFloat(document.getElementById('tax-input').value) || 0;
      receipt.tip = parseFloat(document.getElementById('tip-input').value) || 0;
      receipt.roomId = "X7K2";

      localStorage.setItem('currentReceipt', JSON.stringify(receipt));
      localStorage.setItem('activeRoomCode', receipt.roomId);
      window.location.href = "claim.html";
    }

    document.addEventListener('DOMContentLoaded', renderItems);
  </script>
</body>
</html>
