<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FairShare - Final Breakdown</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased flex justify-center">

  <main class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col justify-between shadow-2xl">
    <!-- Header -->
    <header class="p-4 bg-white border-b border-slate-200 flex justify-between items-center sticky top-0 z-10">
      <div>
        <h1 class="font-bold text-base text-slate-900">Final Settlement</h1>
        <p class="text-xs text-slate-400">Proportional Tax & Tip Applied</p>
      </div>
      <a href="index.html" class="text-xs font-semibold text-emerald-600">Home</a>
    </header>

    <!-- Calculation Container -->
    <div class="flex-1 p-4 overflow-y-auto flex flex-col gap-4">
      
      <!-- Individual Shares -->
      <div>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Individual Shares</h2>
        <div id="breakdown-cards" class="flex flex-col gap-3">
          <!-- Rendered by JS -->
        </div>
      </div>

      <!-- Who Owes Whom -->
      <div>
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Who Owes Whom</h2>
        <div id="settlement-cards" class="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col gap-2">
          <!-- Rendered by JS -->
        </div>
      </div>

    </div>

    <!-- Done Button -->
    <footer class="p-4 bg-white border-t border-slate-200">
      <a href="index.html" class="block w-full py-3.5 bg-slate-800 active:bg-slate-900 text-white font-bold rounded-xl text-center shadow-md transition">
        Done / Start New Bill
      </a>
    </footer>
  </main>

  <script>
    const receipt = JSON.parse(localStorage.getItem('currentReceipt') || '{}');

    function calculateSettlement() {
      // 1. Calculate raw item subtotal for each person
      const totals = {};
      let totalItemCost = 0;

      receipt.items.forEach(item => {
        const claims = item.claims || {};
        Object.entries(claims).forEach(([person, qty]) => {
          if (!totals[person]) totals[person] = { itemsCost: 0, tax: 0, tip: 0, total: 0 };
          const personCost = (item.price * qty);
          totals[person].itemsCost += personCost;
          totalItemCost += personCost;
        });
      });

      // Avoid divide-by-zero if nothing was claimed
      if (totalItemCost === 0) totalItemCost = 1;

      // 2. Distribute tax and tip proportionally
      Object.keys(totals).forEach(person => {
        const ratio = totals[person].itemsCost / totalItemCost;
        totals[person].tax = receipt.tax * ratio;
        totals[person].tip = receipt.tip * ratio;
        totals[person].total = totals[person].itemsCost + totals[person].tax + totals[person].tip;
      });

      // 3. Render Individual Breakdown Cards
      const container = document.getElementById('breakdown-cards');
      container.innerHTML = Object.entries(totals).map(([person, data]) => `
        <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col gap-1 text-xs">
          <div class="flex justify-between items-center font-bold text-sm text-slate-800 border-b border-slate-100 pb-1.5">
            <span>👤 ${person}</span>
            <span class="text-emerald-600">$${data.total.toFixed(2)}</span>
          </div>
          <div class="flex justify-between text-slate-500 pt-1">
            <span>Items Subtotal:</span>
            <span>$${data.itemsCost.toFixed(2)}</span>
          </div>
          <div class="flex justify-between text-slate-500">
            <span>Proportional Tax:</span>
            <span>$${data.tax.toFixed(2)}</span>
          </div>
          <div class="flex justify-between text-slate-500">
            <span>Proportional Tip:</span>
            <span>$${data.tip.toFixed(2)}</span>
          </div>
        </div>
      `).join('');

      // 4. Render settlement list (Assume host paid the main bill)
      const settlementContainer = document.getElementById('settlement-cards');
      const hostName = "Gurman"; // Default demo host
      
      settlementContainer.innerHTML = Object.entries(totals)
        .filter(([person]) => person !== hostName)
        .map(([person, data]) => `
          <div class="flex justify-between items-center text-xs py-1.5 border-b border-slate-100 last:border-0">
            <span class="font-medium text-slate-700"><strong>${person}</strong> owes <strong>${hostName}</strong></span>
            <span class="font-bold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200">
              $${data.total.toFixed(2)}
            </span>
          </div>
        `).join('') || '<span class="text-xs text-slate-400">All balances are settled.</span>';
    }

    document.addEventListener('DOMContentLoaded', calculateSettlement);
  </script>
</body>
</html>
