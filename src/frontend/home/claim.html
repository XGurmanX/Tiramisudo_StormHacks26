<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FairShare - Claim Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-800 antialiased flex justify-center">

  <main class="w-full max-w-md min-h-screen bg-slate-50 flex flex-col justify-between shadow-2xl">
    <!-- Header -->
    <header class="p-4 bg-white border-b border-slate-200 flex justify-between items-center sticky top-0 z-10">
      <div>
        <span class="text-xs font-semibold px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded-full">
          Room: <span id="room-code-tag">----</span>
        </span>
        <h1 class="font-bold text-sm text-slate-800 mt-1" id="merchant-name">Restaurant</h1>
      </div>
      <div id="active-user-badge" class="text-xs font-medium bg-slate-100 px-2 py-1 rounded">
        Claiming as: <strong>You</strong>
      </div>
    </header>

    <!-- Unclaimed Items Warning Banner -->
    <div id="unclaimed-banner" class="bg-amber-50 border-b border-amber-200 p-2.5 px-4 text-xs text-amber-800 font-medium flex items-center justify-between">
      <span>⚠️ Some items are still unclaimed</span>
      <span id="unclaimed-count" class="font-bold">--</span>
    </div>

    <!-- Items List -->
    <div class="flex-1 p-4 overflow-y-auto flex flex-col gap-3" id="claim-items-container">
      <!-- Generated by JavaScript -->
    </div>

    <!-- Bottom Finalize Button -->
    <footer class="p-4 bg-white border-t border-slate-200 flex flex-col gap-2">
      <button onclick="finalizeBill()" class="w-full py-3.5 bg-emerald-600 active:bg-emerald-700 text-white font-bold rounded-xl shadow-md transition">
        Finalize & View Breakdown →
      </button>
    </footer>
  </main>

  <script>
    let receipt = JSON.parse(localStorage.getItem('currentReceipt') || '{}');
    let currentUser = JSON.parse(localStorage.getItem('currentUser') || '{"name":"Gurman"}');

    document.getElementById('room-code-tag').innerText = localStorage.getItem('activeRoomCode') || 'X7K2';
    document.getElementById('merchant-name').innerText = receipt.merchant || 'The Local Eatery';
    document.getElementById('active-user-badge').innerHTML = `Claiming as: <strong>${currentUser.name}</strong>`;

    function renderClaimRoom() {
      const container = document.getElementById('claim-items-container');
      let totalUnclaimed = 0;

      container.innerHTML = receipt.items.map(item => {
        const claims = item.claims || {};
        const totalClaimed = Object.values(claims).reduce((a, b) => a + b, 0);
        const remaining = item.quantity - totalClaimed;
        totalUnclaimed += remaining;
        const myClaim = claims[currentUser.name] || 0;

        return `
          <div class="bg-white p-4 rounded-2xl border ${remaining === 0 ? 'border-emerald-300' : 'border-slate-200'} shadow-sm flex flex-col gap-2">
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-sm text-slate-800">${item.name}</h3>
                <span class="text-xs text-slate-400">$${item.price.toFixed(2)} each × ${item.quantity}</span>
              </div>
              <span class="text-xs font-bold px-2 py-0.5 rounded-full ${remaining === 0 ? 'bg-emerald-100 text-emerald-800' : 'bg-slate-100 text-slate-600'}">
                ${totalClaimed}/${item.quantity} claimed
              </span>
            </div>

            <!-- Claimers Pills -->
            <div class="flex flex-wrap gap-1 mt-1">
              ${Object.entries(claims).map(([name, qty]) => `
                <span class="text-[10px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full border border-slate-200">
                  ${name}:${qty}
                </span>
              `).join('')}
              ${totalClaimed === 0 ? '<span class="text-[11px] text-slate-400 italic">No one has claimed this yet</span>' : ''}
            </div>

            <!-- Claim Controls -->
            <div class="flex items-center justify-between pt-2 border-t border-slate-100 mt-1">
              <span class="text-xs font-semibold text-slate-600">Your Share: ${myClaim}</span>
              <div class="flex gap-1.5">
                <button onclick="adjustClaim(${item.id}, -1)" class="w-8 h-8 rounded-lg border border-slate-200 text-slate-700 font-bold active:bg-slate-100 text-xs">-</button>
                <button onclick="adjustClaim(${item.id}, 1)" ${remaining <= 0 ? 'disabled class="w-8 h-8 rounded-lg bg-slate-100 text-slate-300 font-bold text-xs"' : 'class="w-8 h-8 rounded-lg bg-emerald-600 text-white font-bold active:bg-emerald-700 text-xs"'}>+</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Banner status
      const banner = document.getElementById('unclaimed-banner');
      if (totalUnclaimed > 0) {
        banner.classList.remove('hidden');
        document.getElementById('unclaimed-count').innerText = `${totalUnclaimed} left`;
      } else {
        banner.classList.add('hidden');
      }
    }

    function adjustClaim(itemId, delta) {
      const item = receipt.items.find(i => i.id === itemId);
      if (!item.claims) item.claims = {};
      const current = item.claims[currentUser.name] || 0;
      const totalClaimed = Object.values(item.claims).reduce((a, b) => a + b, 0);

      if (delta > 0 && totalClaimed >= item.quantity) return;
      if (delta < 0 && current <= 0) return;

      item.claims[currentUser.name] = current + delta;
      if (item.claims[currentUser.name] === 0) delete item.claims[currentUser.name];

      localStorage.setItem('currentReceipt', JSON.stringify(receipt));
      renderClaimRoom();
    }

    function finalizeBill() {
      localStorage.setItem('currentReceipt', JSON.stringify(receipt));
      window.location.href = "breakdown.html";
    }

    document.addEventListener('DOMContentLoaded', renderClaimRoom);
  </script>
</body>
</html>
